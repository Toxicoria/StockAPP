services:
  # PostgreSQL
  postgres_dev:
    image: docker.io/library/postgres:16-alpine
    container_name: db_sistema_stock
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin_dev
      POSTGRES_PASSWORD: password_dev
      POSTGRES_DB: stock_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
      - ../services/stock-operations/model/esquema.sql:/docker-entrypoint-initdb.d/01_esquema.sql:ro,z
      - ../services/stock-operations/model/seed_dev.sql:/docker-entrypoint-initdb.d/02_seed_dev.sql:ro,z

  # Servicio interno en Go (lógica de negocio)
  api_go:
    build:
      context: ../services/stock-operations
    container_name: api_sistema_stock
    restart: unless-stopped
    depends_on:
      - postgres_dev
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres_dev
      DB_PORT: "5432"
      DB_USER: admin_dev
      DB_PASSWORD: password_dev
      DB_NAME: stock_db
      STOCK_API_URL: http://api_ts:3000
      CONFIG_SECRET_KEY: ${CONFIG_SECRET_KEY:-clave_local_dev_no_usar_en_produccion}

  # stock-api (TS/Express): usuarios + puerta de entrada (gateway en :3000)
  api_ts:
    build:
      context: ../services/stock-api
    container_name: gateway_sistema_stock
    restart: unless-stopped
    depends_on:
      - postgres_dev
      - api_go
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres_dev
      DB_PORT: "5432"
      DB_USER: admin_dev
      DB_PASSWORD: password_dev
      DB_NAME: stock_db
      JWT_SECRET: ${JWT_SECRET:-secreto_solo_para_desarrollo}
      GO_INTERNO: http://api_go:8080
      PUERTO: "3000"

  # front-admin (Panel Web en Vue 3 + TS)
  front_admin:
    build:
      context: ../../front-admin
    container_name: admin_sistema_stock
    restart: unless-stopped
    depends_on:
      - api_ts
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:3000

volumes:
  pg_data_dev: