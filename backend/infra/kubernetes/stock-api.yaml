apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-api
  labels: { app: stock-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: stock-api }
  template:
    metadata:
      labels: { app: stock-api }
    spec:
      containers:
        - name: stock-api
          image: localhost/stock-api:dev
          imagePullPolicy: Never # la imagen se carga con `k3d image import`, no de un registry
          ports:
            - containerPort: 3000
          env:
            - name: PUERTO
              value: "3000"
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: admin_dev
            - name: DB_PASSWORD
              value: password_dev
            - name: DB_NAME
              value: stock_db
            - name: JWT_SECRET
              value: secreto_solo_para_desarrollo
            - name: GO_INTERNO
              value: http://stock-operations:8080
          readinessProbe:
            httpGet:
              path: /api/ping
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: stock-api
spec:
  selector: { app: stock-api }
  ports:
    - port: 3000
      targetPort: 3000
