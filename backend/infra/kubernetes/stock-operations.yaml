apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-operations
  labels: { app: stock-operations }
spec:
  replicas: 1
  selector:
    matchLabels: { app: stock-operations }
  template:
    metadata:
      labels: { app: stock-operations }
    spec:
      containers:
        - name: stock-operations
          image: localhost/stock-operations:dev
          imagePullPolicy: Never # la imagen se carga con `k3d image import`, no de un registry
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: admin_dev
            - name: DB_PASSWORD
              value: password_dev
            - name: DB_NAME
              value: stock_db
            - name: STOCK_API_URL
              value: http://stock-api:3000
            - name: CONFIG_SECRET_KEY
              value: clave_local_dev_no_usar_en_produccion
          readinessProbe:
            httpGet:
              path: /api/ping
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: stock-operations
spec:
  selector: { app: stock-operations }
  ports:
    - port: 8080
      targetPort: 8080
