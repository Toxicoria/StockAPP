name: Backend CI (Go)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'cliente-sidecar/**'
  pull_request:
    branches:
      - main

jobs:
  construir-y-probar:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar el repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Instalar Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            backend/services/stock-operations/go.sum
            cliente-sidecar/go.sum

      - name: 📦 Verificar stock-operations (Go)
        working-directory: ./backend/services/stock-operations
        run: |
          go build -v ./...
          go vet ./...

      - name: 👻 Verificar Cliente Sidecar
        working-directory: ./cliente-sidecar
        run: |
          go build -v ./...
          go vet ./...

      - name: 🟦 Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🚪 Verificar stock-api (TypeScript)
        working-directory: ./backend/services/stock-api
        run: |
          npm ci --no-audit --no-fund
          npm run check
