name: Backend CI (Go)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'cliente-sidecar/**'
  pull_request:
    branches:
      - main

jobs:
  construir-y-probar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin_dev
          POSTGRES_PASSWORD: password_dev
          POSTGRES_DB: stock_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin_dev -d stock_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: 📥 Clonar el repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Instalar Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            backend/services/stock-operations/go.sum
            cliente-sidecar/go.sum

      - name: 📦 Verificar stock-operations (Go)
        working-directory: ./backend/services/stock-operations
        env:
          TEST_DATABASE_URL: postgresql://admin_dev:password_dev@localhost:5432/stock_db?sslmode=disable
        run: |
          go build -v ./...
          go vet ./...
          go test -tags=integration ./...

      - name: 👻 Verificar Cliente Sidecar
        working-directory: ./cliente-sidecar
        run: |
          go build -v ./...
          go vet ./...

      - name: 🟦 Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🚪 Verificar stock-api (TypeScript)
        working-directory: ./backend/services/stock-api
        env:
          TEST_DATABASE_URL: postgresql://admin_dev:password_dev@localhost:5432/stock_db?sslmode=disable
          DB_PASSWORD: password_dev
          JWT_SECRET: integration-test-jwt-secret-with-enough-entropy
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm test
