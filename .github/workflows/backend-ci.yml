name: StockAPP CI / CD Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  verificar-servicios:
    name: Verificar Servicios y Frontend Admin
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar el repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Instalar Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            backend/services/stock-operations/go.sum
            cliente-sidecar/go.sum

      - name: 📦 Verificar stock-operations (Go)
        working-directory: ./backend/services/stock-operations
        run: |
          go build -v ./...
          go vet ./...

      - name: 👻 Verificar Cliente Sidecar
        working-directory: ./cliente-sidecar
        run: |
          go build -v ./...
          go vet ./...

      - name: 🟦 Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🚪 Verificar stock-api (TypeScript)
        working-directory: ./backend/services/stock-api
        run: |
          npm ci --no-audit --no-fund
          npm run check

      - name: 🖥️ Verificar front-admin (Vue 3 + TypeScript)
        working-directory: ./front-admin
        run: |
          npm ci --no-audit --no-fund
          npm run build

  verificar-contenedores:
    name: Verificar Construcción de Contenedores Docker/Podman
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar el repositorio
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build Imagen stock-operations (Go)
        uses: docker/build-push-action@v6
        with:
          context: ./backend/services/stock-operations
          push: false
          tags: stock-operations:test

      - name: 🐳 Build Imagen stock-api (Gateway Node)
        uses: docker/build-push-action@v6
        with:
          context: ./backend/services/stock-api
          push: false
          tags: stock-api:test

      - name: 🐳 Build Imagen front-admin (Vue 3 + Nginx)
        uses: docker/build-push-action@v6
        with:
          context: ./front-admin
          push: false
          tags: front-admin:test
